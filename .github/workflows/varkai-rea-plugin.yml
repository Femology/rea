name: Varkai REA ChatGPT bridge
on:
  pull_request:
    paths:
      - "integrations/chatgpt-varkai-rea/**"
      - ".github/workflows/varkai-rea-plugin.yml"
  push:
    branches:
      - "feat/chatgpt-varkai-rea-mcp-bridge"
    paths:
      - "integrations/chatgpt-varkai-rea/**"
      - ".github/workflows/varkai-rea-plugin.yml"
permissions:
  contents: read
jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: |
          node --check integrations/chatgpt-varkai-rea/src/rea-client.mjs
          node --check integrations/chatgpt-varkai-rea/src/server.mjs
          node --check integrations/chatgpt-varkai-rea/tests/bridge.test.mjs
      - name: Verify plugin manifest parses
        run: node -e "const m=require('./integrations/chatgpt-varkai-rea/plugin.json'); if(m.name!=='varkai-rea') process.exit(1);"
      - name: Test isolated MCP gateway
        run: node --test integrations/chatgpt-varkai-rea/tests/bridge.test.mjs
      - name: Install REA release for integration smoke test
        run: npm install --prefix "$RUNNER_TEMP/varkai-rea-smoke" --no-fund --no-audit --no-save rea-agents@6.8.0
      - name: Test the real REA engine through MCP
        env:
          REA_ENTRY: ${{ runner.temp }}/varkai-rea-smoke/node_modules/rea-agents/scripts/rea.mjs
        run: node --test integrations/chatgpt-varkai-rea/tests/real-rea.test.mjs
